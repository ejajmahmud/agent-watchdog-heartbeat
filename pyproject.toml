[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-watchdog-heartbeat"
version = "0.1.0"
description = "Subagent liveness probe and auto-recovery supervisor restarting stalled or hallucinating worker processes"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-watchdog-heartbeat = "agent_watchdog_heartbeat.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_watchdog_heartbeat*"]
